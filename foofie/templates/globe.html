<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foofie 美食地球</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.130/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.130/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #cesium-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030712;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }

        .cesium-viewer-bottom,
        .cesium-credit-logoContainer {
            display: none !important;
        }

        .globe-control-shell {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 20;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            pointer-events: none;
        }

        .globe-control-shell button,
        .layer-panel,
        .count-badge {
            pointer-events: auto;
        }

        .globe-btn {
            background: rgba(15, 23, 42, 0.85);
            color: #f8fafc;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        @supports (backdrop-filter: blur(1px)) {
            .globe-btn {
                background: rgba(15, 23, 42, 0.65);
                backdrop-filter: blur(10px);
            }
        }

        .globe-btn:hover { background: rgba(15, 23, 42, 0.95); }

        .right-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .count-badge {
            background: rgba(15, 23, 42, 0.85);
            color: #f8fafc;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 13px;
        }
        @supports (backdrop-filter: blur(1px)) {
            .count-badge {
                background: rgba(15, 23, 42, 0.65);
                backdrop-filter: blur(10px);
            }
        }

        .layer-panel {
            width: 230px;
            background: rgba(15, 23, 42, 0.9);
            color: #f8fafc;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 16px 46px rgba(0,0,0,0.35);
        }
        @supports (backdrop-filter: blur(1px)) {
            .layer-panel {
                background: rgba(15, 23, 42, 0.7);
                backdrop-filter: blur(12px);
            }
        }

        .layer-title {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.04em;
            color: #cbd5e1;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 9px;
            font-size: 13px;
        }

        .control-row label {
            color: #e2e8f0;
            white-space: nowrap;
        }

        .control-row select {
            max-width: 130px;
            color: #f8fafc;
            background: rgba(15,23,42,0.95);
            border: 1px solid rgba(148,163,184,0.28);
            border-radius: 6px;
            padding: 5px 8px;
        }

        .control-row input {
            width: 16px;
            height: 16px;
        }

        #detail-popup {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            width: min(360px, calc(100vw - 28px));
            display: none;
            color: #f8fafc;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 16px 18px;
            box-shadow: 0 20px 70px rgba(0,0,0,0.5);
        }
        @supports (backdrop-filter: blur(1px)) {
            #detail-popup {
                background: rgba(15, 23, 42, 0.75);
                backdrop-filter: blur(16px);
            }
        }

        #detail-popup h2 {
            font-size: 18px;
            line-height: 1.25;
            margin: 0 26px 4px 0;
        }

        #detail-popup p {
            margin: 4px 0;
            color: #cbd5e1;
            font-size: 13px;
        }

        #detail-popup img {
            width: 96px;
            height: 72px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 10px;
        }

        #detail-popup a {
            display: inline-block;
            margin-top: 12px;
            color: white;
            background: #f97316;
            text-decoration: none;
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
        }

        #detail-popup a:hover { background: #ea580c; }

        .close-btn {
            position: absolute;
            top: 9px;
            right: 10px;
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: 50%;
            color: #cbd5e1;
            background: rgba(255,255,255,0.08);
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.15);
        }

        #status-msg {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 30;
            color: #fecaca;
            background: rgba(127,29,29,0.78);
            border: 1px solid rgba(248,113,113,0.35);
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 13px;
            display: none;
        }

        @media (max-width: 640px) {
            .globe-control-shell {
                top: 12px;
                left: 12px;
                right: 12px;
            }

            .layer-panel {
                width: 188px;
                padding: 10px;
            }

            .control-row {
                font-size: 12px;
            }

            .control-row select {
                max-width: 104px;
            }
        }
    </style>
</head>
<body>
    <div id="cesium-container"></div>

    <div class="globe-control-shell">
        <button id="back-btn" class="globe-btn" type="button" onclick="window.location.href='/'">← 返回</button>
        <div class="right-stack">
            <div class="count-badge">🌍 <span id="record-count">0</span> 道美食</div>
            <button id="reset-btn" class="globe-btn" type="button" title="回到初始视角">🏠 重置视角</button>
            <div class="layer-panel" aria-label="地球图层控制">
                <div class="layer-title">图层</div>
                <div class="control-row">
                    <label for="basemap-select">底图</label>
                    <select id="basemap-select">
                        <option value="satellite" selected>卫星图</option>
                        <option value="osm">街道图</option>
                    </select>
                </div>
                <div class="control-row">
                    <label for="food-layer-toggle">美食点位</label>
                    <input id="food-layer-toggle" type="checkbox" checked>
                </div>
                <div class="control-row">
                    <label for="rating-filter">最低评分</label>
                    <select id="rating-filter">
                        <option value="1">全部</option>
                        <option value="3">3 星以上</option>
                        <option value="4">4 星以上</option>
                        <option value="5">5 星</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div id="detail-popup"></div>
    <div id="status-msg"></div>

    <script>
    (function () {
        // WebGL 检测
        if (!(function(){try{var c=document.createElement('canvas');return!!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')))}catch(e){return!1}})()) {
            document.getElementById('cesium-container').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#f8fafc;font-size:18px;flex-direction:column;gap:16px;"><p>⚠️ 您的浏览器不支持 WebGL</p><p style="font-size:14px;color:#94a3b8;">请使用 Chrome/Edge/Firefox 等现代浏览器打开</p></div>';
            return;
        }

        const recordsUrl = '/api/records';
        const countEl = document.getElementById('record-count');
        const popupEl = document.getElementById('detail-popup');
        const statusEl = document.getElementById('status-msg');
        const foodLayerToggle = document.getElementById('food-layer-toggle');
        const ratingFilter = document.getElementById('rating-filter');
        const basemapSelect = document.getElementById('basemap-select');
        const FLY_TO_HEIGHT = 1200;
        const DEFAULT_LON = 104;
        const DEFAULT_LAT = 32;
        const DEFAULT_ALTITUDE = 14500000;

        // WGS-84 → GCJ-02（显示层转换，库仍存 WGS-84）
        function wgs84ToGcj02(lon, lat) {
            var PI = Math.PI, a = 6378245, ee = 0.006693421622965943;
            function tL(x, y) {
                var r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
                r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI))*2/3;
                r += (20*Math.sin(y*PI) + 40*Math.sin(y/3*PI))*2/3;
                r += (160*Math.sin(y/12*PI) + 320*Math.sin(y*PI/30))*2/3;
                return r;
            }
            function tN(x, y) {
                var r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
                r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI))*2/3;
                r += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI))*2/3;
                r += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI))*2/3;
                return r;
            }
            var dLat = tL(lon - 105, lat - 35);
            var dLon = tN(lon - 105, lat - 35);
            var radLat = lat / 180 * PI, magic = Math.sin(radLat);
            magic = 1 - ee * magic * magic;
            var sM = Math.sqrt(magic);
            dLat = (dLat * 180) / ((a * (1 - ee)) / (magic * sM) * PI);
            dLon = (dLon * 180) / (a / sM * Math.cos(radLat) * PI);
            return [lon + dLon, lat + dLat];
        }

        const viewer = new Cesium.Viewer('cesium-container', {
            baseLayer: false,
            animation: false,
            timeline: false,
            geocoder: false,
            homeButton: false,
            sceneModePicker: false,
            baseLayerPicker: false,
            navigationHelpButton: false,
            fullscreenButton: false,
            infoBox: false,
            selectionIndicator: false,
            requestRenderMode: true,
            maximumRenderTimeChange: Infinity,
        });

        viewer.scene.globe.enableLighting = false;
        viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#1d4f63');
        viewer.scene.skyAtmosphere.show = true;
        viewer.scene.screenSpaceCameraController.minimumZoomDistance = 200;
        viewer.scene.screenSpaceCameraController.maximumZoomDistance = 24000000;
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(DEFAULT_LON, DEFAULT_LAT, DEFAULT_ALTITUDE),
        });

        function resetCamera() {
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(DEFAULT_LON, DEFAULT_LAT, DEFAULT_ALTITUDE),
                duration: 1.2,
                orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
            });
            hidePopup();
        }

        document.getElementById('reset-btn').addEventListener('click', resetCamera);

        const imageryLayers = viewer.imageryLayers;
        const basemaps = {
            osm: function () {
                return new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
                    url: 'https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scl=1&style=8&x={x}&y={y}&z={z}',
                    subdomains: ['1', '2', '3', '4'],
                    maximumLevel: 18,
                    minimumLevel: 0,
                    credit: '© 高德地图',
                }));
            },
            satellite: function () {
                return new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
                    url: 'https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scl=1&style=6&x={x}&y={y}&z={z}',
                    subdomains: ['1', '2', '3', '4'],
                    maximumLevel: 18,
                    minimumLevel: 0,
                    credit: '© 高德地图',
                }));
            },
            dark: function () {
                return new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
                    url: 'https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scl=1&style=8&x={x}&y={y}&z={z}',
                    subdomains: ['1', '2', '3', '4'],
                    maximumLevel: 18,
                    minimumLevel: 0,
                    credit: '© 高德地图',
                }));
            },
        };

        let activeBaseLayer = basemaps.satellite();
        imageryLayers.add(activeBaseLayer);

        const foodLayer = new Cesium.CustomDataSource('food-records');
        viewer.dataSources.add(foodLayer);

        function showStatus(message) {
            statusEl.textContent = message;
            statusEl.style.display = 'block';
        }

        function clearStatus() {
            statusEl.textContent = '';
            statusEl.style.display = 'none';
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, function (char) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;',
                }[char];
            });
        }

        function markerColor(rating) {
            if (rating <= 2) return '#ff3b30';
            if (rating === 3) return '#ffcc00';
            if (rating === 4) return '#34c759';
            return '#ff7a00';
        }

        function markerImage(color) {
            const svg =
                '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">' +
                '<circle cx="24" cy="24" r="22" fill="rgba(0,0,0,0.42)"/>' +
                '<circle cx="24" cy="24" r="18" fill="#fff"/>' +
                '<circle cx="24" cy="24" r="12" fill="' + color + '"/>' +
                '<circle cx="19" cy="18" r="4" fill="#fff" opacity="0.55"/>' +
                '</svg>';
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        function addFoodEntity(record) {
            var gcj = wgs84ToGcj02(record.longitude, record.latitude);
            var color = markerColor(record.rating);
            var entity = foodLayer.entities.add({
                id: 'food-' + record.id,
                position: Cesium.Cartesian3.fromDegrees(gcj[0], gcj[1]),
                billboard: {
                    image: markerImage(color),
                    width: 22 + record.rating * 3,
                    height: 22 + record.rating * 3,
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                    verticalOrigin: Cesium.VerticalOrigin.CENTER,
                    scaleByDistance: new Cesium.NearFarScalar(100000, 1.25, 12000000, 0.72),
                    translucencyByDistance: new Cesium.NearFarScalar(100000, 1, 18000000, 0.68),
                    disableDepthTestDistance: Number.POSITIVE_INFINITY,
                },
                label: {
                    text: record.dish_name,
                    font: '13px sans-serif',
                    fillColor: Cesium.Color.WHITE,
                    outlineColor: Cesium.Color.BLACK.withAlpha(0.72),
                    outlineWidth: 3,
                    style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                    pixelOffset: new Cesium.Cartesian2(0, -24),
                    showBackground: true,
                    backgroundColor: Cesium.Color.BLACK.withAlpha(0.45),
                    backgroundPadding: new Cesium.Cartesian2(7, 4),
                    distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 2400000),
                    disableDepthTestDistance: Number.POSITIVE_INFINITY,
                },
                properties: {
                    record: record,
                    rating: record.rating,
                },
            });
        }

        function applyFoodLayerFilters() {
            var minRating = Number(ratingFilter.value);
            var showLayer = foodLayerToggle.checked;
            var entities = foodLayer.entities.values;
            for (var i = 0; i < entities.length; i++) {
                var entity = entities[i];
                if (entity.properties && entity.properties.rating) {
                    entity.show = showLayer && entity.properties.rating.getValue() >= minRating;
                }
            }
            viewer.scene.requestRender();
        }

        function switchBasemap(name) {
            if (activeBaseLayer) imageryLayers.remove(activeBaseLayer, true);
            activeBaseLayer = basemaps[name] ? basemaps[name]() : basemaps.osm();
            imageryLayers.add(activeBaseLayer, 0);
            viewer.scene.requestRender();
        }

        function showPopup(record) {
            const thumbnail = record.thumbnail_path
                ? '<img src="' + escapeHtml(record.thumbnail_path) + '" alt="">'
                : '';
            popupEl.innerHTML =
                '<button class="close-btn" type="button" aria-label="关闭">×</button>' +
                '<h2>' + escapeHtml(record.dish_name) + '</h2>' +
                '<p>🏪 ' + escapeHtml(record.restaurant) + '</p>' +
                '<p>⭐ ' + escapeHtml(record.rating) + ' · ' + escapeHtml(record.cuisine_tag) + '</p>' +
                (record.location_name ? '<p>📍 ' + escapeHtml(record.location_name) + '</p>' : '') +
                thumbnail +
                '<br><a href="/record/' + encodeURIComponent(record.id) + '">查看详情 →</a>';
            popupEl.style.display = 'block';
            popupEl.querySelector('.close-btn').addEventListener('click', hidePopup);
        }

        function hidePopup() {
            popupEl.style.display = 'none';
            popupEl.innerHTML = '';
            viewer.selectedEntity = undefined;
        }

        const clickHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        clickHandler.setInputAction(function (movement) {
            const picked = viewer.scene.pick(movement.position);
            if (!Cesium.defined(picked) || !picked.id || !picked.id.properties || !picked.id.properties.record) {
                hidePopup();
                return;
            }
            const record = picked.id.properties.record.getValue();
            showPopup(record);
            var gcj = wgs84ToGcj02(record.longitude, record.latitude);
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(gcj[0], gcj[1], FLY_TO_HEIGHT),
                duration: 0.75,
            });
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        fetch(recordsUrl)
            .then(function (response) {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(function (records) {
                records.forEach(addFoodEntity);
                countEl.textContent = records.length;
                applyFoodLayerFilters();
                clearStatus();
                viewer.scene.requestRender();
            })
            .catch(function (error) {
                console.error('[Foofie Globe] Failed to load records:', error);
                showStatus('美食点位加载失败');
            });

        basemapSelect.addEventListener('change', function () {
            switchBasemap(basemapSelect.value);
        });
        foodLayerToggle.addEventListener('change', applyFoodLayerFilters);
        ratingFilter.addEventListener('change', applyFoodLayerFilters);
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') hidePopup();
        });
        window.addEventListener('resize', function () {
            viewer.resize();
            viewer.scene.requestRender();
        });
    })();
    </script>
</body>
</html>
