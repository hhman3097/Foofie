<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌍 Foofie 美食地球</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0a0a2e;
            font-family: -apple-system, system-ui, sans-serif;
        }
        #map { width: 100%; height: 100%; position: relative; z-index: 1; }

        .maplibregl-ctrl-attrib {
            background: rgba(0,0,0,0.4) !important;
            font-size: 10px !important;
            padding: 2px 6px !important;
        }

        #back-btn {
            position: fixed; top: 16px; left: 16px; z-index: 20;
            background: rgba(0,0,0,0.55); color: white; border: none;
            padding: 8px 16px; border-radius: 20px; font-size: 13px;
            cursor: pointer; backdrop-filter: blur(6px); letter-spacing: 0.3px;
        }
        #back-btn:hover { background: rgba(0,0,0,0.75); }

        #count-badge {
            position: fixed; top: 16px; right: 16px; z-index: 20;
            background: rgba(0,0,0,0.55); color: white;
            padding: 8px 14px; border-radius: 20px; font-size: 13px;
            backdrop-filter: blur(6px);
        }

        #detail-popup {
            position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
            z-index: 20; background: rgba(12,12,14,0.94); backdrop-filter: blur(16px);
            color: white; padding: 18px 26px; border-radius: 18px;
            display: none; max-width: 340px; width: 90%; text-align: center;
            border: 1px solid rgba(255,255,255,0.07);
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            cursor: pointer;
            animation: popupIn 0.25s ease-out;
        }
        @keyframes popupIn {
            from { opacity: 0; transform: translateX(-50%) translateY(16px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        #detail-popup .dish-name { font-size: 19px; font-weight: 700; margin-bottom: 2px; }
        #detail-popup .restaurant { font-size: 14px; opacity: 0.65; }
        #detail-popup .rating { font-size: 15px; margin: 6px 0 4px; }
        #detail-popup .tag {
            display: inline-block; padding: 2px 10px; border-radius: 12px;
            font-size: 12px; background: rgba(249,115,22,0.18); color: #fb923c;
        }
        #detail-popup .comment { font-size: 13px; opacity: 0.5; margin: 4px 0 0; }
        #detail-popup .goto {
            display: inline-block; margin-top: 12px; padding: 8px 22px;
            background: #f97316; color: white; border-radius: 22px;
            text-decoration: none; font-size: 13px; font-weight: 500;
        }
        #detail-popup .goto:hover { background: #ea580c; }
        #detail-popup .close-btn {
            position: absolute; top: 6px; right: 12px;
            background: none; border: none; color: rgba(255,255,255,0.3);
            font-size: 16px; cursor: pointer;
        }
        #detail-popup .close-btn:hover { color: rgba(255,255,255,0.7); }

        #popup-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 19; display: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <button id="back-btn" onclick="window.location.href='/'">← 返回</button>
    <div id="count-badge">🌍 <span id="record-count">0</span> 道美食</div>
    <div id="popup-backdrop"></div>
    <div id="detail-popup"></div>

    <script>
    (function() {
        const map = new maplibregl.Map({
            container: 'map',
            projection: 'globe',
            style: {
                version: 8,
                sources: {
                    'osm-tiles': {
                        type: 'raster',
                        tiles: [
                            'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
                            'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
                            'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png',
                        ],
                        tileSize: 256,
                        attribution: '&copy; OpenStreetMap contributors',
                        maxzoom: 19,
                    }
                },
                layers: [
                    { id: 'osm', type: 'raster', source: 'osm-tiles' }
                ]
            },
            center: [104, 35],
            zoom: 1.5,
            minZoom: 1,
            maxZoom: 18,
            attributionControl: true,
            renderWorldCopies: true,
        });

        map.on('load', () => {
            console.log('[Foofie Globe] Map loaded, projection:', map.getProjection()?.type || 'unknown');
            document.body.style.background = '#000';

            // 加载标记
            fetch('/api/records')
                .then(r => r.json())
                .then(records => {
                    document.getElementById('record-count').textContent = records.length;
                    records.forEach(d => {
                        const size = 18 + d.rating * 3;
                        const color = d.rating <= 2 ? '#ff4444'
                                    : d.rating <= 3 ? '#ffaa44'
                                    : d.rating <= 4 ? '#44ff88'
                                    : '#00ffcc';
                        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
                            <circle cx="${size/2}" cy="${size/2}" r="${size/2-1}" fill="${color}" opacity="0.25"/>
                            <circle cx="${size/2}" cy="${size/2}" r="${size/4}" fill="${color}"/>
                            <circle cx="${size/2-size/8}" cy="${size/2-size/8}" r="${size/10}" fill="#fff" opacity="0.45"/>
                        </svg>`;
                        const el = document.createElement('div');
                        el.style.cssText = `width:${size}px;height:${size}px;background:url(data:image/svg+xml,${encodeURIComponent(svg)}) center/contain no-repeat;cursor:pointer;`;
                        el.title = `${d.dish_name} — ${d.restaurant}`;

                        new maplibregl.Marker({ element: el, anchor: 'center' })
                            .setLngLat([d.longitude, d.latitude])
                            .addTo(map);

                        el.addEventListener('click', () => {
                            map.flyTo({ center: [d.longitude, d.latitude], zoom: 10, duration: 700 });
                            showPopup(d);
                        });
                    });
                    console.log('[Foofie Globe] Loaded', records.length, 'records');
                })
                .catch(err => console.error('[Foofie Globe] Fetch error:', err));
        });

        map.on('error', e => console.error('[Foofie Globe] Map error:', e));

        // 弹窗
        const popupEl = document.getElementById('detail-popup');
        const backdropEl = document.getElementById('popup-backdrop');

        function showPopup(d) {
            const stars = '⭐'.repeat(d.rating);
            popupEl.innerHTML = `
                <button class="close-btn" onclick="event.stopPropagation();document.getElementById('detail-popup').style.display='none';document.getElementById('popup-backdrop').style.display='none';">✕</button>
                <div class="dish-name">${d.dish_name}</div>
                <div class="restaurant">🏪 ${d.restaurant}</div>
                <div class="rating">${stars}</div>
                <span class="tag">${d.cuisine_tag}</span>
                ${d.comment ? `<div class="comment">💬 ${d.comment}</div>` : ''}
                <a href="/record/${d.id}" class="goto">查看详情 →</a>
            `;
            popupEl.style.display = 'block';
            backdropEl.style.display = 'block';
            popupEl.onclick = e => {
                if (e.target.tagName !== 'A' && !e.target.classList.contains('close-btn'))
                    window.location.href = '/record/' + d.id;
            };
        }

        function hidePopup() {
            popupEl.style.display = 'none';
            backdropEl.style.display = 'none';
        }

        backdropEl.addEventListener('click', hidePopup);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePopup(); });

        window.addEventListener('resize', () => map.resize());
    })();
    </script>
</body>
</html>
