<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌍 Foofie 美食地球</title>
    <!-- CesiumJS -->
    <link href="https://unpkg.com/cesium@1.120.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://unpkg.com/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
        #cesium-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* 隐藏 Cesium 默认控件 */
        .cesium-viewer-bottom, .cesium-widget-credits,
        .cesium-viewer-toolbar, .cesium-viewer-animationContainer,
        .cesium-viewer-timelineContainer, .cesium-viewer-fullscreenContainer,
        .cesium-sceneModePicker-wrapper, .cesium-home-button { display: none !important; }

        #back-btn {
            position: fixed; top: 20px; left: 20px; z-index: 100;
            background: rgba(0,0,0,0.6); color: white; border: none;
            padding: 10px 18px; border-radius: 24px; font-size: 14px;
            cursor: pointer; backdrop-filter: blur(4px);
        }
        #back-btn:hover { background: rgba(0,0,0,0.8); }
        #count-badge {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            background: rgba(0,0,0,0.6); color: white; padding: 8px 16px;
            border-radius: 24px; font-size: 14px; backdrop-filter: blur(4px);
        }

        /* 自定义弹窗 */
        #detail-popup {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 100; background: rgba(10,10,10,0.92); backdrop-filter: blur(12px);
            color: white; padding: 20px 28px; border-radius: 20px;
            display: none; max-width: 360px; width: 90%; text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #detail-popup .dish-name { font-size: 20px; font-weight: 700; }
        #detail-popup .restaurant { font-size: 14px; opacity: 0.7; }
        #detail-popup .rating { font-size: 16px; margin: 6px 0; }
        #detail-popup .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; background: rgba(249,115,22,0.2); color: #fb923c; }
        #detail-popup .comment { font-size: 13px; opacity: 0.6; margin-top: 6px; }
        #detail-popup .goto {
            display: inline-block; margin-top: 10px; padding: 8px 24px;
            background: #f97316; color: white; border-radius: 24px;
            text-decoration: none; font-size: 13px;
        }
        #detail-popup .goto:hover { background: #ea580c; }

        #popup-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 99; display: none;
        }
    </style>
</head>
<body>
    <div id="cesium-container"></div>
    <button id="back-btn" onclick="window.location.href='/'">← 返回列表</button>
    <div id="count-badge">🌍 <span id="record-count">0</span> 道美食</div>
    <div id="popup-backdrop"></div>
    <div id="detail-popup"></div>

    <script>
    // 配置 Cesium 资源路径
    window.CESIUM_BASE_URL = 'https://unpkg.com/cesium@1.120.0/Build/Cesium/';

    async function initGlobe() {
        // 使用 OpenStreetMap 瓦片（免费，无需 token，包含省市县边界和地名）
        const viewer = new Cesium.Viewer('cesium-container', {
            imageryProvider: new Cesium.OpenStreetMapImageryProvider({
                url: 'https://tile.openstreetmap.org/',
                credit: '© OpenStreetMap contributors',
                maximumLevel: 19,
            }),
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            sceneModePicker: false,
            navigationHelpButton: false,
            animation: false,
            timeline: false,
            fullscreenButton: false,
            vrButton: false,
            infoBox: false,
            selectionIndicator: false,
            shadows: false,
            shouldAnimate: false,
        });

        // 场景设置
        const scene = viewer.scene;
        scene.globe.enableLighting = false;
        scene.globe.atmosphereBrightnessShift = 0.4;
        scene.screenSpaceCameraController.minimumZoomDistance = 5000000;  // ~地球周长/8
        scene.screenSpaceCameraController.maximumZoomDistance = 50000000;

        // 初始视角：面向中国
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(104.0, 35.0, 25000000),
            orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-30),
                roll: 0,
            },
        });

        // 禁用自动旋转（用户拖拽控制）
        scene.camera.controller.enableRotate = true;
        scene.camera.controller.enableZoom = true;
        scene.camera.controller.enableTilt = true;

        // 移除默认双击缩放行为，避免干扰标记点击
        scene.screenSpaceCameraController.enableLook = false;

        // ---- 加载美食标记 ----
        let selectedEntity = null;
        let popupActive = false;
        const popupEl = document.getElementById('detail-popup');
        const backdropEl = document.getElementById('popup-backdrop');
        const recordCount = document.getElementById('record-count');

        // 标记样式（根据评分）
        function getMarkerColor(rating) {
            if (rating <= 2) return Cesium.Color.RED;
            if (rating <= 3) return Cesium.Color.ORANGE;
            if (rating <= 4) return Cesium.Color.LIME;
            return Cesium.Color.CYAN;
        }

        function getMarkerSize(rating) {
            return 10 + rating * 2;
        }

        // 添加悬浮标记（billboard + 光晕 circle）
        function addFoodMarker(data, entityCollection) {
            const color = getMarkerColor(data.rating);
            const size = getMarkerSize(data.rating);

            // 底部脉冲圆
            const entity = entityCollection.add({
                id: 'food-' + data.id,
                position: Cesium.Cartesian3.fromDegrees(data.longitude, data.latitude),
                billboard: {
                    image: createMarkerImage(size, color),
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                    scale: 1.0,
                    disableDepthTestDistance: 1000000,
                },
                properties: {
                    foodData: JSON.stringify(data),
                },
            });
            return entity;
        }

        // 生成标记图片（Canvas）
        function createMarkerImage(size, color) {
            const canvas = document.createElement('canvas');
            const w = size * 4;
            const h = size * 4;
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');

            // 外围光晕
            const gradient = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
            const cssColor = color.toCssColorString();
            gradient.addColorStop(0, cssColor + '80');
            gradient.addColorStop(0.3, cssColor + '40');
            gradient.addColorStop(1, cssColor + '00');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(w/2, h/2, w/2, 0, Math.PI * 2);
            ctx.fill();

            // 核心圆
            ctx.fillStyle = cssColor;
            ctx.beginPath();
            ctx.arc(w/2, h/2, size * 0.8, 0, Math.PI * 2);
            ctx.fill();

            // 白色高光
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(w/2 - size*0.2, h/2 - size*0.2, size * 0.3, 0, Math.PI * 2);
            ctx.fill();

            return canvas;
        }

        // 加载数据
        try {
            const resp = await fetch('/api/records');
            const records = await resp.json();
            recordCount.textContent = records.length;

            // 添加标记到 entities
            records.forEach(r => addFoodMarker(r, viewer.entities));
            console.log('[Foofie Globe] Loaded', records.length, 'records');
        } catch (err) {
            console.error('[Foofie Globe] Failed:', err);
        }

        // ---- 交互 ----
        const handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);

        // Hover 检测
        handler.setInputAction(function(movement) {
            if (popupActive) {
                document.body.style.cursor = 'default';
                return;
            }
            const picked = scene.pick(movement.endPosition);
            if (Cesium.defined(picked) && picked.id && picked.id.id && picked.id.id.startsWith('food-')) {
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'grab';
            }
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        // 点击检测
        handler.setInputAction(function(click) {
            if (popupActive) {
                hidePopup();
                return;
            }

            const picked = scene.pick(click.position);
            if (Cesium.defined(picked) && picked.id && picked.id.properties) {
                const props = picked.id.properties;
                if (props.foodData) {
                    const data = JSON.parse(props.foodData.getValue());
                    showPopup(data);
                    // 飞行到标记位置
                    viewer.camera.flyTo({
                        destination: Cesium.Cartesian3.fromDegrees(data.longitude, data.latitude, 500000),
                        duration: 0.8,
                        orientation: {
                            heading: Cesium.Math.toRadians(0),
                            pitch: Cesium.Math.toRadians(-45),
                            roll: 0,
                        },
                    });
                    return;
                }
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        function showPopup(data) {
            popupActive = true;
            const stars = '⭐'.repeat(data.rating);
            const color = getMarkerColor(data.rating);
            popupEl.innerHTML = `
                <div class="dish-name">${data.dish_name}</div>
                <div class="restaurant">🏪 ${data.restaurant}</div>
                <div class="rating">${stars}</div>
                <div><span class="tag">${data.cuisine_tag}</span></div>
                ${data.comment ? `<div class="comment">💬 ${data.comment}</div>` : ''}
                <a href="/record/${data.id}" class="goto">查看完整信息 →</a>
            `;
            popupEl.style.display = 'block';
            backdropEl.style.display = 'block';

            popupEl.onclick = (e) => {
                if (e.target.tagName !== 'A') window.location.href = '/record/' + data.id;
            };
        }

        function hidePopup() {
            popupEl.style.display = 'none';
            backdropEl.style.display = 'none';
            popupActive = false;
        }

        backdropEl.addEventListener('pointerdown', hidePopup);

        // 键盘 ESC 关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') hidePopup();
        });

        // 自适应
        window.addEventListener('resize', () => {
            viewer.resize();
        });
    }

    initGlobe().catch(err => {
        console.error('[Foofie Globe] Init failed:', err);
        document.body.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:#ff6b6b;font-family:sans-serif;flex-direction:column;gap:12px;">
                <div style="font-size:48px;">🌍</div>
                <div>3D 地球加载失败</div>
                <div style="font-size:13px;opacity:0.6;">${err.message}</div>
                <a href="/" style="color:#f97316;margin-top:8px;">← 返回首页</a>
            </div>
        `;
    });
    </script>
</body>
</html>
