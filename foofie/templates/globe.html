<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌍 Foofie 美食地球</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: -apple-system, system-ui, sans-serif; }
        #map { width: 100%; height: 100%; }

        /* 去掉 maplibre 默认 logo/attribution（保留 attribution 法律要求） */
        .maplibregl-ctrl-attrib {
            background: rgba(0,0,0,0.5) !important;
            color: rgba(255,255,255,0.5) !important;
            font-size: 10px !important;
            padding: 2px 8px !important;
            border-radius: 4px !important;
        }
        .maplibregl-ctrl-attrib a { color: rgba(255,255,255,0.6) !important; }

        #back-btn {
            position: fixed; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.6); color: white; border: none;
            padding: 10px 18px; border-radius: 24px; font-size: 14px;
            cursor: pointer; backdrop-filter: blur(6px);
        }
        #back-btn:hover { background: rgba(0,0,0,0.8); }

        #count-badge {
            position: fixed; top: 20px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.6); color: white; padding: 8px 16px;
            border-radius: 24px; font-size: 14px; backdrop-filter: blur(6px);
        }

        /* 弹窗 */
        #detail-popup {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(10,10,10,0.92); backdrop-filter: blur(14px);
            color: white; padding: 20px 28px; border-radius: 20px;
            display: none; max-width: 360px; width: 90%; text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 36px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #detail-popup .dish-name { font-size: 20px; font-weight: 700; }
        #detail-popup .restaurant { font-size: 14px; opacity: 0.7; margin-top: 2px; }
        #detail-popup .rating { font-size: 16px; margin: 6px 0; }
        #detail-popup .tag {
            display: inline-block; padding: 2px 10px; border-radius: 12px;
            font-size: 12px; background: rgba(249,115,22,0.2); color: #fb923c;
            margin-top: 2px;
        }
        #detail-popup .comment { font-size: 13px; opacity: 0.55; margin-top: 6px; }
        #detail-popup .goto {
            display: inline-block; margin-top: 10px; padding: 8px 24px;
            background: #f97316; color: white; border-radius: 24px;
            text-decoration: none; font-size: 13px; font-weight: 500;
        }
        #detail-popup .goto:hover { background: #ea580c; }

        #popup-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9; display: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <button id="back-btn" onclick="window.location.href='/'">← 返回列表</button>
    <div id="count-badge">🌍 <span id="record-count">0</span> 道美食</div>
    <div id="popup-backdrop"></div>
    <div id="detail-popup"></div>

    <script>
    (async function() {
        // ---- 初始化地图 ----
        const map = new maplibregl.Map({
            container: 'map',
            projection: 'globe',
            style: {
                version: 8,
                sources: {
                    'osm': {
                        type: 'raster',
                        tiles: [
                            'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
                            'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
                            'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png',
                        ],
                        tileSize: 256,
                        attribution: '© OpenStreetMap',
                        maxzoom: 19,
                    }
                },
                layers: [
                    { id: 'osm-layer', type: 'raster', source: 'osm' }
                ]
            },
            center: [104, 35],
            zoom: 1.2,
            minZoom: 1,
            maxZoom: 18,
            attributionControl: true,
            renderWorldCopies: true,
        });

        // 星空背景（通过 canvas 覆盖）
        const skyCanvas = document.createElement('canvas');
        skyCanvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;';
        skyCanvas.width = window.innerWidth;
        skyCanvas.height = window.innerHeight;
        const skyCtx = skyCanvas.getContext('2d');
        skyCtx.fillStyle = '#0a0a1a';
        skyCtx.fillRect(0, 0, skyCanvas.width, skyCanvas.height);
        // 星星
        for (let i = 0; i < 400; i++) {
            const x = Math.random() * skyCanvas.width;
            const y = Math.random() * skyCanvas.height;
            const r = Math.random() * 1.2;
            skyCtx.beginPath();
            skyCtx.arc(x, y, r, 0, Math.PI * 2);
            skyCtx.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.5})`;
            skyCtx.fill();
        }
        // 大气光晕（顶部弧形渐变）
        const glowGrad = skyCtx.createRadialGradient(
            skyCanvas.width / 2, skyCanvas.height / 2,
            Math.min(skyCanvas.width, skyCanvas.height) * 0.35,
            skyCanvas.width / 2, skyCanvas.height / 2,
            Math.min(skyCanvas.width, skyCanvas.height) * 1.2
        );
        glowGrad.addColorStop(0, 'rgba(10,10,26,0)');
        glowGrad.addColorStop(0.6, 'rgba(10,10,26,0.3)');
        glowGrad.addColorStop(1, 'rgba(10,10,26,0.95)');
        skyCtx.fillStyle = glowGrad;
        skyCtx.fillRect(0, 0, skyCanvas.width, skyCanvas.height);

        document.body.appendChild(skyCanvas);

        // 自适应星空
        window.addEventListener('resize', () => {
            skyCanvas.width = window.innerWidth;
            skyCanvas.height = window.innerHeight;
        });

        // 等地图加载完
        await new Promise(resolve => map.once('load', resolve));

        // 淡入效果
        map.setPaintProperty('osm-layer', 'raster-opacity', 0);
        const fadeStart = performance.now();
        function fadeIn(now) {
            const t = Math.min(1, (now - fadeStart) / 800);
            map.setPaintProperty('osm-layer', 'raster-opacity', t);
            if (t < 1) requestAnimationFrame(fadeIn);
        }
        requestAnimationFrame(fadeIn);

        console.log('[Foofie Globe] MapLibre globe ready');

        // ---- 加载美食数据 ----
        let popupActive = false;
        const popupEl = document.getElementById('detail-popup');
        const backdropEl = document.getElementById('popup-backdrop');
        const countEl = document.getElementById('record-count');

        function markerColor(rating) {
            if (rating <= 2) return '#ff4444';
            if (rating <= 3) return '#ffaa44';
            if (rating <= 4) return '#44ff88';
            return '#00ffcc';
        }

        function createMarkerSVG(rating) {
            const color = markerColor(rating);
            const size = 16 + rating * 3;
            return `<?xml version="1.0" encoding="UTF-8"?>
            <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
                <defs>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="2" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <circle cx="${size/2}" cy="${size/2}" r="${size/2 - 2}" fill="${color}" opacity="0.3" filter="url(#glow)"/>
                <circle cx="${size/2}" cy="${size/2}" r="${size/4}" fill="${color}"/>
                <circle cx="${size/2 - size/10}" cy="${size/2 - size/10}" r="${size/10}" fill="white" opacity="0.5"/>
            </svg>`;
        }

        function dataURL(svg) {
            return 'data:image/svg+xml,' + encodeURIComponent(svg);
        }

        try {
            const resp = await fetch('/api/records');
            const records = await resp.json();
            countEl.textContent = records.length;

            records.forEach(d => {
                const el = document.createElement('div');
                const marker = new maplibregl.Marker({
                    element: el,
                    anchor: 'center',
                });
                el.style.cssText = `width:${20+d.rating*3}px;height:${20+d.rating*3}px;background:url(${dataURL(createMarkerSVG(d.rating))}) center/contain no-repeat;cursor:pointer;`;
                el.title = `${d.dish_name} — ${d.restaurant}`;

                marker.setLngLat([d.longitude, d.latitude]).addTo(map);

                el.addEventListener('click', () => {
                    map.flyTo({ center: [d.longitude, d.latitude], zoom: 10, duration: 800 });
                    showPopup(d);
                });
            });

            console.log('[Foofie Globe] Loaded', records.length, 'records');
        } catch (err) {
            console.error('[Foofie Globe] Load error:', err);
        }

        // ---- 弹窗逻辑 ----
        function showPopup(d) {
            popupActive = true;
            const stars = '⭐'.repeat(d.rating);
            popupEl.innerHTML = `
                <div class="dish-name">${d.dish_name}</div>
                <div class="restaurant">🏪 ${d.restaurant}</div>
                <div class="rating">${stars}</div>
                <div><span class="tag">${d.cuisine_tag}</span></div>
                ${d.comment ? `<div class="comment">💬 ${d.comment}</div>` : ''}
                <a href="/record/${d.id}" class="goto">查看完整信息 →</a>
            `;
            popupEl.style.display = 'block';
            backdropEl.style.display = 'block';
            popupEl.onclick = function(e) {
                if (e.target.tagName !== 'A') window.location.href = '/record/' + d.id;
            };
        }

        function hidePopup() {
            popupEl.style.display = 'none';
            backdropEl.style.display = 'none';
            popupActive = false;
        }

        backdropEl.addEventListener('click', hidePopup);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePopup(); });

        // 点击地图空白关闭弹窗
        map.on('click', e => {
            if (popupActive && !e.originalEvent.defaultPrevented) {
                hidePopup();
            }
        });
    })();
    </script>
</body>
</html>
